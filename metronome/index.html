<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SneakyMetronome</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style.css">
  <script src="../tool-frame.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="header"><a href="../index.html">← Outils</a></header>
  <main class="workspace">
    <h1 class="sr-only">SneakyMetronome</h1>
    <section class="instrument" aria-label="Métronome">
      <p id="status" class="status" role="status">Prêt à jouer</p>
      <div class="tempo-control">
        <button id="slower" class="step" aria-label="Réduire le tempo de 1">−</button>
        <div class="tempo-number">
          <label class="sr-only" for="tempo">Tempo en battements par minute</label>
          <input id="tempo" type="number" min="30" max="240" value="90" inputmode="numeric">
          <span id="tempo-unit">BPM · NOIRE</span>
        </div>
        <button id="faster" class="step" aria-label="Augmenter le tempo de 1">+</button>
      </div>
      <label class="sr-only" for="tempo-range">Régler le tempo</label>
      <input id="tempo-range" class="tempo-range" type="range" min="30" max="240" value="90">
      <div id="beats" class="beats" aria-label="Repères des temps"></div>
      <p class="beat-caption" id="beat-caption">1 mesure de départ.</p>
      <div class="settings">
        <div>
          <span class="field-label" id="signature-label">Signature</span>
          <div class="segmented" role="group" aria-labelledby="signature-label">
            <button data-signature="4" class="selected" aria-pressed="true">4/4</button>
            <button data-signature="6" aria-pressed="false">6/8</button>
          </div>
        </div>
        <div>
          <label class="field-label" for="omissions">Tics oubliés</label>
          <input id="omissions" class="number-input" type="number" min="0" max="8" value="3" inputmode="numeric">
        </div>
        <div>
          <label class="field-label" for="measures">Sur</label>
          <select id="measures"><option value="1">1 mesure</option><option value="2" selected>2 mesures</option><option value="4">4 mesures</option><option value="8">8 mesures</option></select>
        </div>
      </div>
      <p class="pattern-note" id="pattern-summary">3 silences sur 8 tics · aléatoire</p>
      <div class="options">
        <label><input id="visual" type="checkbox"> Repères visuels</label>
        <label><input id="accent" type="checkbox" checked> Accent au premier temps</label>
      </div>
      <button id="play" class="primary-button play"><span id="play-icon" aria-hidden="true">▶</span> <span id="play-label">Commencer</span></button>
      <p id="error" role="alert" hidden></p>
      <p class="shortcut">Espace : jouer / arrêter</p>
    </section>
  </main>
</body>
</html>
