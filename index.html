<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harmonies · SneakyMetronome</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="shell.css">
  <script src="shell.js" defer></script>
</head>
<body class="tools-shell">
  <header class="tools-header">
    <div class="tool-tabs" role="tablist" aria-label="Outils de pratique">
      <button id="tab-harmonies" type="button" role="tab" aria-selected="true" aria-controls="panel-harmonies" data-tool="harmonies">Harmonies</button>
      <button id="tab-metronome" type="button" role="tab" aria-selected="false" aria-controls="panel-metronome" tabindex="-1" data-tool="metronome">SneakyMetronome</button>
    </div>
  </header>
  <main class="tool-viewport" aria-label="Espace de pratique">
    <div class="tool-track">
      <section id="panel-harmonies" class="tool-panel" role="tabpanel" aria-labelledby="tab-harmonies">
        <iframe title="Harmonies — exercices de basse" src="basse/index.html?embedded=1" data-frame="harmonies" allow="fullscreen"></iframe>
      </section>
      <section id="panel-metronome" class="tool-panel" role="tabpanel" aria-labelledby="tab-metronome" inert aria-hidden="true">
        <iframe title="SneakyMetronome — pratique du rythme" src="metronome/index.html?embedded=1" data-frame="metronome" allow="fullscreen"></iframe>
      </section>
    </div>
  </main>
</body>
</html>
