<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harmonies</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../tool-frame.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="header"><a href="../index.html">← Outils</a></header>
  <main class="workspace">
    <h1 class="sr-only">Harmonies</h1>
    <section class="practice-card" aria-label="Exercice d’harmonie">
      <div class="exercise" aria-live="polite" aria-atomic="true">
        <span class="exercise-label">Tonalité</span>
        <div id="key" class="exercise-key">—</div>
        <span class="exercise-label">Progression</span>
        <div id="prog" class="exercise-progression">—</div>
        <p id="sub" class="exercise-description"></p>
      </div>
      <div class="exercise-actions">
        <button class="primary-button" id="next">Nouvel exercice</button>
        <button class="secondary-button" id="fs">Plein écran</button>
      </div>
      <p id="fullscreen-message" role="status" hidden></p>
      <details class="practice-settings">
        <summary>Réglages</summary>
        <div class="bass-settings">
          <label>Mode<select id="quality"><option value="both">Majeur + mineur</option><option value="major">Majeur seulement</option><option value="minor">Mineur seulement</option></select></label>
          <label>Altérations<select id="acc"><option value="both">Bémols + dièses</option><option value="flats">Bémols seulement</option><option value="sharps">Dièses seulement</option></select></label>
          <label>Tonalités<select id="easy"><option value="off">Toutes les tonalités</option><option value="on">Tonalités faciles</option></select></label>
        </div>
      </details>
      <details class="practice-settings">
        <summary>Comment pratiquer</summary>
        <ol class="instructions">
          <li>Trouvez la tonique partout sur le manche.</li>
          <li>Nommez chaque note de la gamme.</li>
          <li>Jouez les triades de la progression.</li>
        </ol>
      </details>
      <p class="shortcut">Espace ou Entrée : nouvel exercice</p>
    </section>
  </main>
</body>
</html>
